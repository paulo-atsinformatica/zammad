version: '3.8'
x-shared:
  zammad-service:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.1.4'
    restart: '${RESTART:-always}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: zammad.atsinformatica.com.br
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
services:
  zammad-railsserver:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.1.4'
    restart: '${RESTART:-always}'
    mem_limit: '${RAILSSERVER_MEM_LIMIT:-1500m}'
    memswap_limit: '${RAILSSERVER_MEM_LIMIT:-1500m}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: zammad.atsinformatica.com.br
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
      # Puma: 1 worker process + 3 threads — reduz RAM sem afetar throughput
      WEB_CONCURRENCY: '${WEB_CONCURRENCY:-0}'
      RAILS_MAX_THREADS: '${RAILS_MAX_THREADS:-3}'
      # Evita fork de background workers no railsserver (só roda no scheduler)
      ZAMMAD_PROCESS_SESSIONS_JOBS_WORKERS: '0'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-railsserver
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis
  zammad-nginx:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.1.4'
    restart: '${RESTART:-always}'
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: zammad.atsinformatica.com.br
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-nginx
    expose:
      - '${NGINX_PORT:-8080}'
    ports:
      - '${NGINX_EXPOSE_PORT:-8080}:${NGINX_PORT:-8080}'
    depends_on:
      - zammad-railsserver
  zammad-scheduler:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.1.4'
    restart: '${RESTART:-always}'
    mem_limit: '${SCHEDULER_MEM_LIMIT:-800m}'
    memswap_limit: '${SCHEDULER_MEM_LIMIT:-800m}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: zammad.atsinformatica.com.br
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
      # Desabilita fork de workers de sessão (padrão: até 16 forks = ~2GB).
      # Com 0, roda como threads no processo principal — suficiente para a carga atual.
      ZAMMAD_PROCESS_SESSIONS_JOBS_WORKERS: '${ZAMMAD_PROCESS_SESSIONS_JOBS_WORKERS:-0}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-scheduler
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis
  zammad-websocket:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.1.4'
    restart: '${RESTART:-always}'
    mem_limit: 400m
    memswap_limit: 400m
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: zammad.atsinformatica.com.br
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-websocket
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis
  zammad-init:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.1.4'
    restart: on-failure
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: zammad.atsinformatica.com.br
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-init
    user: '0:0'
    depends_on:
      - zammad-postgresql
  zammad-backup:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.1.4'
    restart: '${RESTART:-always}'
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: zammad.atsinformatica.com.br
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-backup:/var/tmp/zammad'
      - 'zammad-storage:/opt/zammad/storage:ro'
    command:
      - zammad-backup
    user: '0:0'
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis
  zammad-postgresql:
    image: 'postgres:${POSTGRES_VERSION:-17.7-alpine}'
    restart: '${RESTART:-always}'
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-zammad_production}'
      POSTGRES_USER: '${POSTGRES_USER:-zammad}'
      POSTGRES_PASSWORD: '${POSTGRES_PASS:-zammad}'
    volumes:
      - 'postgresql-data:/var/lib/postgresql/data'
  zammad-elasticsearch:
    image: 'elasticsearch:${ELASTICSEARCH_VERSION:-8.19.8}'
    restart: '${RESTART:-always}'
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}'
    volumes:
      - 'elasticsearch-data:/usr/share/elasticsearch/data'
  zammad-memcached:
    image: 'memcached:${MEMCACHE_VERSION:-1.6.39-alpine}'
    restart: '${RESTART:-always}'
    mem_limit: 384m
    memswap_limit: 384m
    command: 'memcached -m 256M'
  zammad-redis:
    image: 'redis:${REDIS_VERSION:-7.4.7-alpine}'
    restart: '${RESTART:-always}'
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - 'redis-data:/data'
volumes:
  elasticsearch-data:
    driver: local
  postgresql-data:
    driver: local
  redis-data:
    driver: local
  zammad-backup:
    driver: local
  zammad-storage:
    driver: local
