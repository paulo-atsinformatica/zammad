version: '3.8'

x-shared:
  zammad-service:
    image: 'ghcr.io/paulo-atsinformatica/zammad:latest'
    restart: '${RESTART:-always}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRESQL_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRESQL_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRESQL_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRESQL_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRESQL_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-zammad.atsinformatica.com.br}'
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'

services:
  zammad-railsserver:
    image: 'ghcr.io/paulo-atsinformatica/zammad:latest'
    restart: '${RESTART:-always}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRESQL_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRESQL_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRESQL_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRESQL_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRESQL_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-zammad.atsinformatica.com.br}'
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-railsserver
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis

  zammad-nginx:
    image: 'ghcr.io/paulo-atsinformatica/zammad:latest'
    restart: '${RESTART:-always}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRESQL_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRESQL_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRESQL_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRESQL_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRESQL_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-zammad.atsinformatica.com.br}'
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-nginx
    expose:
      - '${NGINX_PORT:-8080}'
    ports:
      - '${NGINX_EXPOSE_PORT:-8080}:${NGINX_PORT:-8080}'
    depends_on:
      - zammad-railsserver

  zammad-scheduler:
    image: 'ghcr.io/paulo-atsinformatica/zammad:latest'
    restart: '${RESTART:-always}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRESQL_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRESQL_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRESQL_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRESQL_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRESQL_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-zammad.atsinformatica.com.br}'
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-scheduler
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis

  zammad-websocket:
    image: 'ghcr.io/paulo-atsinformatica/zammad:latest'
    restart: '${RESTART:-always}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRESQL_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRESQL_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRESQL_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRESQL_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRESQL_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-zammad.atsinformatica.com.br}'
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-websocket
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis

  zammad-init:
    image: 'ghcr.io/paulo-atsinformatica/zammad:latest'
    restart: on-failure
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRESQL_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRESQL_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRESQL_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRESQL_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRESQL_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-zammad.atsinformatica.com.br}'
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage:/opt/zammad/storage'
    command:
      - zammad-init
    user: '0:0'
    depends_on:
      - zammad-postgresql

  zammad-backup:
    image: 'ghcr.io/paulo-atsinformatica/zammad:latest'
    restart: '${RESTART:-always}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRESQL_DB:-zammad_production}'
      POSTGRESQL_HOST: '${POSTGRESQL_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRESQL_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRESQL_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRESQL_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-zammad.atsinformatica.com.br}'
      ZAMMAD_HTTP_TYPE: https
      NGINX_SERVER_SCHEME: https
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-backup:/var/tmp/zammad'
      - 'zammad-storage:/opt/zammad/storage:ro'
    command:
      - zammad-backup
    user: '0:0'
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis

  zammad-postgresql:
    image: 'postgres:${POSTGRES_VERSION:-17.7-alpine}'
    restart: '${RESTART:-always}'
    environment:
      # Postgres image expects POSTGRES_*; values from POSTGRESQL_* (Coolify-friendly)
      POSTGRES_DB: '${POSTGRESQL_DB:-zammad_production}'
      POSTGRES_USER: '${POSTGRESQL_USER:-zammad}'
      POSTGRES_PASSWORD: '${POSTGRESQL_PASS:-zammad}'
    volumes:
      - 'postgresql-data:/var/lib/postgresql/data'

  zammad-elasticsearch:
    image: 'elasticsearch:${ELASTICSEARCH_VERSION:-8.19.8}'
    restart: '${RESTART:-always}'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}'
    volumes:
      - 'elasticsearch-data:/usr/share/elasticsearch/data'

  zammad-memcached:
    image: 'memcached:${MEMCACHE_VERSION:-1.6.39-alpine}'
    restart: '${RESTART:-always}'
    command: 'memcached -m 256M'

  zammad-redis:
    image: 'redis:${REDIS_VERSION:-7.4.7-alpine}'
    restart: '${RESTART:-always}'
    volumes:
      - 'redis-data:/data'

volumes:
  elasticsearch-data:
    driver: local
  postgresql-data:
    driver: local
  redis-data:
    driver: local
  zammad-backup:
    driver: local
  zammad-storage:
    driver: local
