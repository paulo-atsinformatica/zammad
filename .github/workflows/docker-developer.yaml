name: docker-developer

on:
  push:
    branches:
      - developer

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Zammad version from VERSION file
        run: echo "ZAMMAD_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zammad:developer
            ghcr.io/${{ github.repository_owner }}/zammad:${{ env.ZAMMAD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
