version: '3.8'
# Compose de TESTE isolado, gerado a partir de docker-compose.coolify.yml,
# só trocando a tag da imagem pra 7.2.0 e isolando volumes/porta/FQDN do
# stack de produção (que segue travado em 7.1.4). Não sobrescreve o
# compose original.
#
# Se for rodar via `docker compose` direto (fora do Coolify), suba com um
# project name próprio pra garantir isolamento total de redes/containers:
#   docker compose -p zammad-test-720 -f docker-compose.coolify.test-7.2.0.yml up -d
#
# ZAMMAD_FQDN e ZAMMAD_HTTP_TYPE (http/https) já default pro seu ambiente
# atual (acesso via sslip.io sem TLS). Se depois for testar atrás de um
# domínio com TLS de verdade no Coolify, sobrescreva ambos via env var —
# ZAMMAD_HTTP_TYPE=https precisa bater com o scheme real usado no navegador,
# senão o cookie de sessão vira "secure" e não volta em conexão http pura
# (é isso que causa "Falha na verificação do token CSRF").
x-shared:
  zammad-service:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.2.0'
    restart: '${RESTART:-always}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_test720}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-atsticket.163.176.255.228.sslip.io}'
      ZAMMAD_HTTP_TYPE: '${ZAMMAD_HTTP_TYPE:-http}'
      NGINX_SERVER_SCHEME: '${ZAMMAD_HTTP_TYPE:-http}'
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage-test720:/opt/zammad/storage'
services:
  zammad-railsserver:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.2.0'
    restart: '${RESTART:-always}'
    mem_limit: '${RAILSSERVER_MEM_LIMIT:-1500m}'
    memswap_limit: '${RAILSSERVER_MEM_LIMIT:-1500m}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_test720}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-atsticket.163.176.255.228.sslip.io}'
      ZAMMAD_HTTP_TYPE: '${ZAMMAD_HTTP_TYPE:-http}'
      NGINX_SERVER_SCHEME: '${ZAMMAD_HTTP_TYPE:-http}'
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
      # Puma: 1 worker process + 3 threads — reduz RAM sem afetar throughput
      WEB_CONCURRENCY: '${WEB_CONCURRENCY:-0}'
      RAILS_MAX_THREADS: '${RAILS_MAX_THREADS:-3}'
      # Evita fork de background workers no railsserver (só roda no scheduler)
      ZAMMAD_PROCESS_SESSIONS_JOBS_WORKERS: '0'
    volumes:
      - 'zammad-storage-test720:/opt/zammad/storage'
    command:
      - zammad-railsserver
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis
  zammad-nginx:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.2.0'
    restart: '${RESTART:-always}'
    mem_limit: '${NGINX_MEM_LIMIT:-512m}'
    memswap_limit: '${NGINX_MEM_LIMIT:-512m}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_test720}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-atsticket.163.176.255.228.sslip.io}'
      ZAMMAD_HTTP_TYPE: '${ZAMMAD_HTTP_TYPE:-http}'
      NGINX_SERVER_SCHEME: '${ZAMMAD_HTTP_TYPE:-http}'
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage-test720:/opt/zammad/storage'
    command:
      - zammad-nginx
    expose:
      - '${NGINX_PORT:-8080}'
    ports:
      - '${NGINX_EXPOSE_PORT:-8181}:${NGINX_PORT:-8080}'
    depends_on:
      - zammad-railsserver
  zammad-scheduler:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.2.0'
    restart: '${RESTART:-always}'
    mem_limit: '${SCHEDULER_MEM_LIMIT:-800m}'
    memswap_limit: '${SCHEDULER_MEM_LIMIT:-800m}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_test720}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-atsticket.163.176.255.228.sslip.io}'
      ZAMMAD_HTTP_TYPE: '${ZAMMAD_HTTP_TYPE:-http}'
      NGINX_SERVER_SCHEME: '${ZAMMAD_HTTP_TYPE:-http}'
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
      # Desabilita fork de workers de sessão (padrão: até 16 forks = ~2GB).
      # Com 0, roda como threads no processo principal — suficiente para a carga atual.
      ZAMMAD_PROCESS_SESSIONS_JOBS_WORKERS: '${ZAMMAD_PROCESS_SESSIONS_JOBS_WORKERS:-0}'
    volumes:
      - 'zammad-storage-test720:/opt/zammad/storage'
    command:
      - zammad-scheduler
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis
  zammad-websocket:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.2.0'
    restart: '${RESTART:-always}'
    mem_limit: 400m
    memswap_limit: 400m
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_test720}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-atsticket.163.176.255.228.sslip.io}'
      ZAMMAD_HTTP_TYPE: '${ZAMMAD_HTTP_TYPE:-http}'
      NGINX_SERVER_SCHEME: '${ZAMMAD_HTTP_TYPE:-http}'
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage-test720:/opt/zammad/storage'
    command:
      - zammad-websocket
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis
  # O init é one-shot: roda migrations/seed/configuração e termina. Ao sair, o
  # Coolify vê um container "exited" e marca a aplicação como degradada, mesmo
  # tendo saído com sucesso.
  #
  # Por isso ele passa a ficar ocioso depois de concluir, para o orquestrador ver
  # um container em execução. `sleep infinity` não consome CPU, e mem_limit é
  # teto, não reserva.
  #
  # A alternativa correta em compose puro seria os outros serviços usarem
  # `depends_on: { zammad-init: { condition: service_completed_successfully } }`,
  # mas isso não resolve o sintoma: o container continuaria "exited" e o Coolify
  # continuaria acusando degradado.
  #
  # Se o init falhar, o `&&` corta a cadeia, o container sai com erro e o restart
  # o tenta de novo — a falha continua visível em vez de ser mascarada.
  zammad-init:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.2.0'
    restart: '${RESTART:-always}'
    entrypoint:
      - /usr/bin/env
      - bash
      - -c
    mem_limit: '${INIT_MEM_LIMIT:-1g}'
    memswap_limit: '${INIT_MEM_LIMIT:-1g}'
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_test720}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-atsticket.163.176.255.228.sslip.io}'
      ZAMMAD_HTTP_TYPE: '${ZAMMAD_HTTP_TYPE:-http}'
      NGINX_SERVER_SCHEME: '${ZAMMAD_HTTP_TYPE:-http}'
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-storage-test720:/opt/zammad/storage'
    command:
      - '/opt/zammad/bin/docker-entrypoint zammad-init && echo "zammad-init concluido; ocioso para o orquestrador ver um container em execucao" && exec sleep infinity'
    user: '0:0'
    depends_on:
      - zammad-postgresql
  zammad-backup:
    image: 'ghcr.io/paulo-atsinformatica/zammad:7.2.0'
    restart: '${RESTART:-always}'
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      MEMCACHE_SERVERS: '${MEMCACHE_SERVERS:-zammad-memcached:11211}'
      POSTGRESQL_DB: '${POSTGRES_DB:-zammad_test720}'
      POSTGRESQL_HOST: '${POSTGRES_HOST:-zammad-postgresql}'
      POSTGRESQL_USER: '${POSTGRES_USER:-zammad}'
      POSTGRESQL_PASS: '${POSTGRES_PASS:-zammad}'
      POSTGRESQL_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRESQL_OPTIONS: '${POSTGRESQL_OPTIONS:-?pool=50}'
      REDIS_URL: '${REDIS_URL:-redis://zammad-redis:6379}'
      ZAMMAD_FQDN: '${ZAMMAD_FQDN:-atsticket.163.176.255.228.sslip.io}'
      ZAMMAD_HTTP_TYPE: '${ZAMMAD_HTTP_TYPE:-http}'
      NGINX_SERVER_SCHEME: '${ZAMMAD_HTTP_TYPE:-http}'
      TZ: '${TZ:-America/Sao_Paulo}'
      ELASTICSEARCH_ENABLED: 'true'
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_SCHEMA: http
      BACKUP_DIR: '${BACKUP_DIR:-/var/tmp/zammad}'
      BACKUP_TIME: '${BACKUP_TIME:-03:00}'
      HOLD_DAYS: '${HOLD_DAYS:-10}'
    volumes:
      - 'zammad-backup-test720:/var/tmp/zammad'
      - 'zammad-storage-test720:/opt/zammad/storage:ro'
    command:
      - zammad-backup
    user: '0:0'
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis
  zammad-postgresql:
    image: 'postgres:${POSTGRES_VERSION:-17.7-alpine}'
    restart: '${RESTART:-always}'
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-zammad_test720}'
      POSTGRES_USER: '${POSTGRES_USER:-zammad}'
      POSTGRES_PASSWORD: '${POSTGRES_PASS:-zammad}'
    volumes:
      - 'postgresql-data-test720:/var/lib/postgresql/data'
  zammad-elasticsearch:
    image: 'elasticsearch:${ELASTICSEARCH_VERSION:-8.19.8}'
    restart: '${RESTART:-always}'
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}'
    volumes:
      - 'elasticsearch-data-test720:/usr/share/elasticsearch/data'
  zammad-memcached:
    image: 'memcached:${MEMCACHE_VERSION:-1.6.39-alpine}'
    restart: '${RESTART:-always}'
    mem_limit: 384m
    memswap_limit: 384m
    command: 'memcached -m 256M'
  zammad-redis:
    image: 'redis:${REDIS_VERSION:-7.4.7-alpine}'
    restart: '${RESTART:-always}'
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - 'redis-data-test720:/data'
volumes:
  elasticsearch-data-test720:
    driver: local
  postgresql-data-test720:
    driver: local
  redis-data-test720:
    driver: local
  zammad-backup-test720:
    driver: local
  zammad-storage-test720:
    driver: local
